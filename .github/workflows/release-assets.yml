name: Release Assets

# 手动触发：为已有 Release 标签补齐 macOS / Linux / iOS 构建产物
# Android 由维护者在本地构建上传（需要 Android SDK + NDK 环境）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 Release 标签（例如 v1.3.0）
        required: true
        default: v1.3.0

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build universal app
        run: npx tauri build --target universal-apple-darwin
      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf
      - name: Build Linux bundles
        run: npx tauri build
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Generate iOS project
        run: npx tauri ios init
      - name: Build unsigned app for device
        run: |
          xcodebuild -project src-tauri/gen/apple/QzoneArchive_iOS.xcodeproj \
            -scheme QzoneArchive_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath src-tauri/gen/apple/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build
      - name: Package unsigned ipa
        run: |
          APP="src-tauri/gen/apple/build/Build/Products/Release-iphoneos/QzoneArchive.app"
          test -d "$APP" || { ls src-tauri/gen/apple/build/Build/Products/Release-iphoneos/; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "QzoneArchive_${{ inputs.tag }}_ios-unsigned.ipa" Payload
      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: QzoneArchive_*_ios-unsigned.ipa
          if-no-files-found: error

  publish:
    name: Upload to release
    needs: [macos, linux, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -la dist/
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/* --repo "${{ github.repository }}" --clobber
