name: Repair Windows Release

# 手动触发：为已有 Release 标签重新生成 Windows NSIS、latest.json 和 .sig。
# 不再上传 macOS / Linux / Android / iOS 产物，避免污染 Windows-only Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 Release 标签（例如 v1.3.3）
        required: true
        default: v1.3.3
      source_ref:
        description: 包含签名更新配置的分支或提交（旧标签默认使用 main）
        required: true
        default: main

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Check out source with updater configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload signed updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "QzoneArchive v__VERSION__"
          releaseBody: "Windows NSIS 安装包与 Tauri 签名更新清单。"
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
